<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>Examclock</title>
	<script src="examclock.js"></script>
	<style>
		/* the page fills the window, and the clock gets whatever height
		   the other parts don't use (see sizeCanvas in examclock.js) */
		html, body {
			height: 100%;
		}
		body {
			box-sizing: border-box;
			margin: 0;
			padding: 8px;
			display: flex;
			flex-direction: column;
			/* the same font the clock is drawn in (see font_family in examclock.js) */
			font-family: Helvetica, Arial, sans-serif;
		}
		#clock_area {
			flex: 1 1 0;
			min-height: 0;
			overflow: hidden;
		}
		#canvasOne {
			display: block;
		}

		/* announcements typed here are shown to students under the clock */
		#announcements {
			display: block;
			box-sizing: border-box;
			width: 100%;
			margin-top: 10px;
			padding: 10px 20px;
			font: 40px Helvetica, Arial, sans-serif;
			color: darkred;
			background: #ffffaa;
			border: 1px solid #ccc;
			resize: none;  /* it grows to fit its text (see examclock.js) */
			overflow: hidden;
		}
		#announcements:placeholder-shown {
			font-size: 20px;
		}

		/* the reminder editor is on the left, the buttons on the right */
		#footer {
			display: flex;
			justify-content: space-between;
			align-items: flex-start;
			gap: 20px;
			margin-top: 10px;
		}
		#footer .buttons {
			/* the auto left margin keeps the buttons on the right, even
			   when the reminder editor is hidden */
			margin: 0 0 0 auto;
			white-space: nowrap;
		}

		/* in full screen, the footer shows only the "Exit full screen" button */
		:root:fullscreen #reminders_panel,
		:root:fullscreen #resetbutton,
		:root:fullscreen #footer a {
			display: none;
		}
		#reminders_panel summary {
			cursor: pointer;
		}
		#reminders_panel p {
			max-width: 40em;
		}
		#reminders {
			box-sizing: border-box;
			width: min(40em, 70vw);
			font: 16px Helvetica, Arial, sans-serif;
		}
	</style>
</head>

<body>

<form id="dur_form">
<p id="dur_span">
Duration in minutes: <input id="dur_in_min" type="number" min="1" max="600" step="1" required style="width: 5em"/>
<button id="startbutton" type="submit">Start Timer</button>
</p>
</form>

<div id="clock_area">
<canvas id="canvasOne">
Your browser does not support the HTML5 Canvas.
</canvas>
</div>

<textarea id="announcements" rows="3" placeholder="Type announcements for students here (e.g. corrections to the exam)."></textarea>

<div id="footer">
<details id="reminders_panel">
<summary>Reminder messages</summary>
<p>
The clock shows one of these at a time, chosen at random. Put each message
on its own line; changes take effect right away. Leave it empty to show no reminders.
</p>
<textarea id="reminders" rows="8" placeholder="No reminders will be shown."></textarea>
<p><button id="defaultremindersbutton" type="button">Restore default messages</button></p>
</details>
<p class="buttons">
<button id="fullscreenbutton" hidden>Full screen</button>
<button id="resetbutton" hidden>Reset timer</button>
<a href="https://github.com/tjd1234/examclock">Source code.</a>
</p>
</div>

</body>
</html>
